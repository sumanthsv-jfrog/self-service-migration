# Fill in real values and commit — no secrets live here. Access tokens
# come from GitHub Actions secrets: SOURCE_ACCESS_TOKEN /
# TARGET_ACCESS_TOKEN (Settings > Secrets and variables > Actions).
# Currently the workflow uses one token pair for all environments; split
# into per-env secrets (e.g. SOURCE_ACCESS_TOKEN_PROD) if that's wrong
# for your setup, and update the "Configure jf CLI servers" step to match.
# server_id values are arbitrary labels the workflow uses when calling
# `jf config add` — they don't need to match anything pre-existing.

environments:
  prod:
    source_server_id: source-prod
    source_url: https://source.example.com/artifactory
    target_server_id: target-prod
    target_url: https://target.example.com/artifactory
    small_repo_size_threshold_mb: 500
    small_repo_file_threshold: 5000
    max_concurrent_transfers: 1

  staging:
    source_server_id: source-staging
    source_url: https://source-staging.example.com/artifactory
    target_server_id: target-staging
    target_url: https://target-staging.example.com/artifactory
    small_repo_size_threshold_mb: 200
    small_repo_file_threshold: 2000
    max_concurrent_transfers: 1
